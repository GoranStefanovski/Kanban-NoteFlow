services:
  mongodb:
    image: mongo:7.0
    container_name: notepad-mongodb
    restart: unless-stopped
    # Do NOT expose MongoDB port to host in production
    # Only accessible within Docker network
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=personal-notepad
    networks:
      - notepad-network

  backend:
    container_name: notepad-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Expose only to localhost for Nginx reverse proxy
      - "127.0.0.1:3000:3000"
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/personal-notepad}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Personal Notepad}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - PORT=${PORT:-3000}
      - NODE_ENV=${NODE_ENV:-production}
    depends_on:
      - mongodb
    networks:
      - notepad-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    container_name: notepad-frontend
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # API URL from .env (defaults to localhost if not set)
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    restart: unless-stopped
    ports:
      # Expose only to localhost for Nginx reverse proxy
      - "127.0.0.1:3001:3000"
    depends_on:
      - backend
    networks:
      - notepad-network

volumes:
  mongodb_data:
    driver: local

networks:
  notepad-network:
    driver: bridge

